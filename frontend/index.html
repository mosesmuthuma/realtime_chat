<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Chat App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#313338] text-white h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <div class="w-64 bg-[#2b2d31] flex flex-col border-r border-[#1f2023]">
        <div class="h-12 border-b border-[#1f2023] flex items-center px-4 font-bold shadow-sm">
            Realtime Chat
        </div>
        
        <div class="p-4 flex-1 overflow-y-auto">
            <div class="flex items-center justify-between text-xs font-bold text-[#949ba4] mb-2 tracking-wider">
                <span>TEXT CHANNELS</span>
                <button id="add-channel-btn" class="hover:text-white text-sm" title="Add Channel"><i class="fa-solid fa-plus"></i></button>
            </div>
            <!-- Channels List Container -->
            <div id="channels-container" class="space-y-0.5"></div>
        </div>

        <!-- User Profile Footer -->
        <div class="p-3 bg-[#232428] flex flex-col space-y-1">
            <div class="flex items-center justify-between text-sm">
                <span class="text-[#949ba4]">Logged in as: <strong id="current-username" class="text-white"></strong></span>
                <button id="change-username-btn" class="text-xs text-blue-400 hover:underline">Change</button>
            </div>
            <button id="logout-btn" class="text-left text-xs text-red-400 hover:underline">Log Out</button>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col bg-[#313338] relative">
        <!-- Chat Header -->
        <div class="h-12 border-b border-[#1f2023] flex items-center justify-between px-4 shadow-sm bg-[#313338] z-10">
            <div class="flex items-center space-x-2">
                <span id="current-channel-title" class="font-bold text-white">No Channels</span>
            </div>
            <button id="clear-chat-btn" class="text-xs text-[#949ba4] hover:text-white bg-[#383a40] px-2.5 py-1 rounded">Clear Chat</button>
        </div>

        <!-- Messages Section -->
        <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

        <!-- Typing Indicator -->
        <div id="typing-indicator" class="px-4 text-xs text-[#949ba4] h-4"></div>

        <!-- Chat Input Form Footer -->
        <div class="p-4 bg-[#313338] relative">
            <!-- Emoji Picker Popup -->
            <div id="emoji-picker" class="absolute bottom-20 left-4 bg-[#2b2d31] border border-[#1f2023] p-2 rounded shadow-lg flex flex-wrap gap-2 hidden z-50 w-64"></div>

            <form id="chat-form" class="bg-[#383a40] rounded-lg flex items-center px-4 py-2.5 relative z-20">
                <button type="button" id="emoji-toggle-btn" class="text-[#949ba4] hover:text-white text-xl mr-3 focus:outline-none">
                    <i class="fa-regular fa-face-smile"></i>
                </button>
                <input type="text" id="message-input" placeholder="Create or select a channel..." class="bg-transparent flex-1 text-white placeholder-[#878992] focus:outline-none text-sm">
                <button type="submit" class="text-[#949ba4] hover:text-white ml-3 focus:outline-none text-lg">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Right Sidebar: Online Users -->
    <div class="w-60 bg-[#2b2d31] border-l border-[#1f2023] flex flex-col">
        <div class="h-12 border-b border-[#1f2023] flex items-center px-4 font-bold text-xs text-[#949ba4] tracking-wider">
            ONLINE — <span id="online-count">0</span>
        </div>
        <div id="online-users-list" class="p-3 flex-1 overflow-y-auto"></div>
    </div>

    <!-- Socket.io Client Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
